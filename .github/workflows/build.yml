name: Build Android APK

on:
  push:
    branches: [ main, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java JDK kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: Capacitor projesini hazirla ve APK derle
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html www/
          npx cap init "BELL AI" "com.bellai.onestate" --web-dir=www
          npx cap add android
          cd android
          # Kotlin ve Gradle uyumunu saglamak icin surum duzeltmesi
          sed -i 's/ext.kotlinVersion = .*/ext.kotlinVersion = "1.9.24"/g' variables.gradle || true
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: BELL-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
