name: Build Android APK

on:
  push:
    branches: [ main, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java JDK kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Capacitor projesini hazirla ve APK derle
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html www/
          npx cap init "BELL AI" "com.bellai.onestate" --web-dir=www
          npx cap add android
          
          # Tum dosyalardaki eski Kotlin surumlerini kesin olarak 1.9.24 yapiyoruz
          cd android
          find . -type f \( -name "*.gradle" -o -name "*.kts" -o -name "build.gradle" \) -exec sed -i 's/1.6.21/1.9.24/g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.kts" -o -name "build.gradle" \) -exec sed -i 's/kotlinVersion = .*/kotlinVersion = "1.9.24"/g' {} +
          
          # Ek olarak root build.gradle icine kotlin eklemesi yapalim
          if ! grep -q "kotlin-gradle-plugin" build.gradle; then
            echo "buildscript { repositories { mavenCentral() } dependencies { classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24\" } }" >> build.gradle
          fi

          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: BELL-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
